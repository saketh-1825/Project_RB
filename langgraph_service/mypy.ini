[mypy]
# Global settings can remain here

[mypy-tests.*]
# Suppress dynamic mock attribute errors and untyped test functions
disable_error_code = attr-defined, annotation-unchecked, typeddict-unknown-key

[mypy-internal.websocket_manager]
# Suppress untyped third party websocket dependencies and redis sync/async stub mismatches
disable_error_code = annotation-unchecked, arg-type

[mypy-internal.redis_client]
# Suppress redis-py stub gap where sync methods erroneously return Awaitable | T
disable_error_code = arg-type

[mypy-internal.analysis_coordinator]
# Suppress redis-py stub gap where sync methods erroneously return Awaitable | T
disable_error_code = arg-type, misc

[mypy-main]
# Suppress redis-py stub gap where sync methods erroneously return Awaitable | T
disable_error_code = arg-type

[mypy-workflow.graph]
# Suppress redis-py stub gap where sync methods erroneously return Awaitable | T
disable_error_code = union-attr, call-overload


